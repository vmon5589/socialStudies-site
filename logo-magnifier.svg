<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Logo concept 1: Analysis/detection — a magnifying glass inspecting a
     social feed post. Gradient = red→purple→blue political spectrum. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="mag-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E63946"/>
      <stop offset="0.5" stop-color="#6C5CE7"/>
      <stop offset="1" stop-color="#1D9BF0"/>
    </linearGradient>
  </defs>

  <!-- Post card -->
  <rect x="6" y="8" width="36" height="40" rx="5" fill="rgba(255,255,255,0.03)" stroke="url(#mag-grad)" stroke-width="2"/>
  <!-- Avatar -->
  <circle cx="15" cy="17" r="4" fill="url(#mag-grad)" opacity="0.9"/>
  <!-- Name + handle -->
  <rect x="22" y="13.7" width="14" height="2.6" rx="1.3" fill="#8892a0"/>
  <rect x="22" y="19" width="9" height="2.2" rx="1.1" fill="#5b6472"/>
  <!-- Body lines -->
  <rect x="11" y="28" width="26" height="2.6" rx="1.3" fill="#8892a0"/>
  <rect x="11" y="34" width="26" height="2.6" rx="1.3" fill="#8892a0"/>
  <rect x="11" y="40" width="17" height="2.6" rx="1.3" fill="#5b6472"/>

  <!-- Magnifying glass -->
  <circle cx="42" cy="42" r="12" fill="rgba(13,17,23,0.6)" stroke="url(#mag-grad)" stroke-width="3.5"/>
  <!-- Lens highlight -->
  <path d="M36.5 39.5 a7 7 0 0 1 5 -3.2" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <!-- Handle -->
  <line x1="50.5" y1="50.5" x2="58" y2="58" stroke="url(#mag-grad)" stroke-width="4" stroke-linecap="round"/>
</svg>
